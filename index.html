<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Goal Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#12122B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#12122B; --bg2:#1A1A2E; --card:#20203A; --card2:#282847;
  --line:rgba(255,255,255,.07);
  --ink:#F2F2F8; --muted:#9A9AB8; --faint:#63637F;
  --orange:#FF6B35; --pink:#EF476F; --blue:#4CC9F0; --green:#06D6A0; --amber:#FFD166; --purple:#9B5DE5;
  --r:18px;
  --display:'Sora',-apple-system,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink); font-family:var(--body);
  overscroll-behavior:none; -webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top);
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea{font-family:inherit}

/* ---------- shell ---------- */
#app{max-width:520px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
main{flex:1;padding:0 16px calc(96px + env(safe-area-inset-bottom));overflow-x:hidden}

/* ---------- header ---------- */
header{padding:14px 16px 4px;display:flex;align-items:center;justify-content:space-between}
.brand{font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.06em;text-transform:uppercase}
.brand em{color:var(--orange);font-style:normal}
.datebar{display:flex;align-items:center;gap:4px;padding:2px 16px 10px}
.datebar .nav{width:38px;height:38px;border-radius:12px;background:var(--card);font-size:16px;color:var(--muted);display:grid;place-items:center;flex:none}
.datebar .nav:active{background:var(--card2)}
.datelabel{flex:1;text-align:center}
.datelabel .dow{font-size:11px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
.datelabel .dm{font-family:var(--display);font-weight:700;font-size:19px}
.todaybtn{font-size:12px;font-weight:600;color:var(--orange);background:rgba(255,107,53,.12);padding:8px 12px;border-radius:12px;flex:none}
.todaybtn.hidden{visibility:hidden}

/* ---------- day ring hero ---------- */
.hero{display:flex;align-items:center;gap:18px;background:linear-gradient(145deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:14px}
.ringwrap{position:relative;width:104px;height:104px;flex:none}
.ringwrap svg{transform:rotate(-90deg)}
.ringpct{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:23px}
.ringpct small{display:block;font-size:9px;font-weight:600;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;text-align:center}
.herostats{flex:1;display:grid;gap:9px}
.hstat{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--muted)}
.hstat b{color:var(--ink);font-variant-numeric:tabular-nums}
.dot{width:9px;height:9px;border-radius:50%;flex:none}

/* ---------- sections & cards ---------- */
.sect{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:20px 2px 10px;display:flex;justify-content:space-between;align-items:baseline}
.sect .sub{font-size:11px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--faint)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}

/* ---------- goal rows ---------- */
.goalrow{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line)}
.goalrow:last-child{border-bottom:none}
.statuschip{width:42px;height:42px;border-radius:13px;flex:none;display:grid;place-items:center;font-size:19px;background:var(--card2);border:1.5px dashed rgba(255,255,255,.14);transition:transform .12s}
.statuschip:active{transform:scale(.88)}
.statuschip.s✅{background:rgba(6,214,160,.16);border:1.5px solid rgba(6,214,160,.5)}
.statuschip.s⏳{background:rgba(255,209,102,.14);border:1.5px solid rgba(255,209,102,.45)}
.statuschip.s❌{background:rgba(239,71,111,.14);border:1.5px solid rgba(239,71,111,.45)}
.statuschip.s⏸️{background:rgba(154,154,184,.14);border:1.5px solid rgba(154,154,184,.4)}
.goaltext{flex:1;font-size:15px;line-height:1.35}
.goaltext.done{color:var(--faint);text-decoration:line-through;text-decoration-color:rgba(6,214,160,.6)}
.goaldel{color:var(--faint);font-size:17px;padding:8px;flex:none}
.addrow{display:flex;gap:10px;padding:12px 14px}
.addrow input{flex:1;background:var(--bg2);border:1px solid var(--line);border-radius:13px;padding:12px 14px;font-size:15px;color:var(--ink)}
.addrow input::placeholder{color:var(--faint)}
.addbtn{width:46px;height:46px;border-radius:13px;background:var(--orange);color:#fff;font-size:22px;font-weight:600;flex:none}
.addbtn:active{filter:brightness(.85)}
.legend{display:flex;gap:14px;justify-content:center;padding:10px 0 2px;font-size:11px;color:var(--faint)}

/* ---------- habits ---------- */
.habitrow{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line)}
.habitrow:last-child{border-bottom:none}
.habitinfo{flex:1;min-width:0}
.habitname{font-size:15px;font-weight:600}
.habitmeta{font-size:11.5px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:7px}
.streak{color:var(--amber)}
.weekpips{display:flex;gap:3.5px;margin-top:7px}
.pip{width:17px;height:5px;border-radius:3px;background:var(--card2)}
.pip.on{background:var(--pink)}
.pip.hit{background:var(--green)}
.pip.today{outline:1.5px solid rgba(255,255,255,.35);outline-offset:1px}
.habitdel{color:var(--faint);font-size:17px;padding:8px;flex:none}
.habitform{padding:14px;display:grid;gap:10px}
.habitform input[type=text]{background:var(--bg2);border:1px solid var(--line);border-radius:13px;padding:12px 14px;font-size:15px;color:var(--ink);width:100%}
.freqrow{display:flex;gap:8px;align-items:center}
.seg{flex:1;display:flex;background:var(--bg2);border-radius:13px;padding:3px;border:1px solid var(--line)}
.seg button{flex:1;padding:9px 0;border-radius:10px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--pink);color:#fff}
.tgt{display:flex;align-items:center;gap:6px;background:var(--bg2);border:1px solid var(--line);border-radius:13px;padding:5px 8px}
.tgt button{width:30px;height:30px;font-size:17px;color:var(--pink);font-weight:700}
.tgt b{min-width:34px;text-align:center;font-variant-numeric:tabular-nums;font-size:14px}

/* ---------- sleep ---------- */
.sleepcard{padding:20px 16px 16px;text-align:center}
.sleepbig{font-family:var(--display);font-weight:800;font-size:52px;line-height:1;font-variant-numeric:tabular-nums}
.sleepbig small{font-size:17px;font-weight:600;color:var(--muted)}
.sleepbig.hit{color:var(--green)}
.sleepbig.under{color:var(--amber)}
.sleepbig.empty{color:var(--faint)}
.sleepctl{display:flex;justify-content:center;gap:14px;margin:16px 0 6px}
.sleepctl button{width:58px;height:58px;border-radius:50%;background:var(--card2);font-size:23px;font-weight:600;color:var(--blue);border:1px solid var(--line)}
.sleepctl button:active{background:var(--bg2)}
.sleepnote{margin-top:12px;width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:13px;padding:11px 14px;font-size:14px;color:var(--ink);text-align:center}
.sleepnote::placeholder{color:var(--faint)}
.sleepclear{margin-top:10px;font-size:12.5px;color:var(--faint);padding:6px}
.tgtline{display:flex;justify-content:space-between;align-items:center;padding:13px 14px;font-size:14px;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:7px;height:120px;padding:16px 14px 6px}
.barcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar{width:100%;max-width:34px;border-radius:7px 7px 3px 3px;background:var(--card2);position:relative;transition:height .3s}
.bar.hit{background:linear-gradient(180deg,var(--blue),#2A9FC9)}
.bar.under{background:linear-gradient(180deg,var(--amber),#D9A93F)}
.barlab{font-size:10px;color:var(--faint);letter-spacing:.04em}
.barval{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.tgthash{position:absolute;left:14px;right:14px;border-top:1.5px dashed rgba(76,201,240,.4);pointer-events:none}

/* ---------- stats ---------- */
.kpigrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px 14px}
.kpi .v{font-family:var(--display);font-weight:800;font-size:25px;font-variant-numeric:tabular-nums}
.kpi .l{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:4px}
.wkrow{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);font-size:13.5px}
.wkrow:last-child{border-bottom:none}
.wkrow .n{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wkrow .c{color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.meter{width:86px;height:7px;border-radius:4px;background:var(--card2);overflow:hidden;flex:none}
.meter i{display:block;height:100%;border-radius:4px;background:var(--pink)}
.meter i.hit{background:var(--green)}
.daygrid7{display:flex;gap:6px;padding:14px}
.dg{flex:1;text-align:center}
.dg .cell{height:44px;border-radius:11px;background:var(--card2);display:grid;place-items:center;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted)}
.dg .cell.p1{background:rgba(6,214,160,.5);color:#fff}
.dg .cell.p2{background:rgba(6,214,160,.28);color:var(--ink)}
.dg .cell.p3{background:rgba(255,209,102,.22);color:var(--ink)}
.dg .cell.p4{background:rgba(239,71,111,.2);color:var(--ink)}
.dg .lab{font-size:10px;color:var(--faint);margin-top:5px}


/* ---------- stats period views ---------- */
.segbar{display:flex;background:var(--card);border-radius:14px;padding:3px;border:1px solid var(--line);margin:12px 0 4px}
.segbar button{flex:1;padding:10px 0;border-radius:11px;font-size:13px;font-weight:600;color:var(--muted)}
.segbar button.on{background:var(--orange);color:#fff}
.periodnav{display:flex;align-items:center;gap:4px;margin:10px 0 2px}
.periodnav .nav{width:36px;height:36px;border-radius:11px;background:var(--card);font-size:15px;color:var(--muted);display:grid;place-items:center;flex:none}
.periodnav .plabel{flex:1;text-align:center;font-family:var(--display);font-weight:700;font-size:16px}
.chartwrap{padding:14px 12px 8px}
.chartwrap svg{display:block;width:100%;height:auto}
.axlab{font-size:9px;fill:var(--faint);font-family:var(--body)}
.axval{font-size:9px;fill:var(--muted);font-family:var(--body)}
.cal{padding:12px 10px}
.calhead{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:5px}
.calhead span{text-align:center;font-size:9.5px;color:var(--faint);letter-spacing:.06em}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calcell{aspect-ratio:1;border-radius:8px;background:var(--card2);display:grid;place-items:center;font-size:10.5px;font-weight:600;color:var(--faint);font-variant-numeric:tabular-nums}
.calcell.blank{background:transparent}
.calcell.p1{background:rgba(6,214,160,.55);color:#fff}
.calcell.p2{background:rgba(6,214,160,.3);color:var(--ink)}
.calcell.p3{background:rgba(255,209,102,.25);color:var(--ink)}
.calcell.p4{background:rgba(239,71,111,.22);color:var(--ink)}
.calcell.today{outline:1.5px solid var(--orange);outline-offset:1px}
.hb12{flex:none}

/* ---------- tab bar ---------- */
nav{position:fixed;bottom:0;left:0;right:0;background:rgba(18,18,43,.86);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
.tabs{max-width:520px;margin:0 auto;display:flex}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--faint);border-radius:14px}
.tab .ic{font-size:21px;line-height:1}
.tab .tl{font-size:10.5px;font-weight:600;letter-spacing:.03em}
.tab.on{color:var(--ink)}
.tab.on .tl{color:var(--orange)}
.empty{padding:26px 18px;text-align:center;color:var(--faint);font-size:14px;line-height:1.5}
.loading{display:grid;place-items:center;min-height:60dvh;color:var(--muted);font-size:14px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">Goal<em>Tracker</em></div>
  </header>
  <main id="main"><div class="loading">Loading your goals…</div></main>
  <nav><div class="tabs" id="tabs"></div></nav>
</div>

<script>
/* ================= data ================= */
const STORE_KEY = 'goaltracker2026:v1';
const STATUS_CYCLE = [null,'✅','⏳','❌','⏸️'];
const uid = () => Math.random().toString(36).slice(2,9);

// Seeded from Chiedu's GoalTracker_Pro_2026.xlsx
const SEED = {
  settings:{ sleepTarget:8 },
  habits:[],
  goals:{},
  habitMarks:{},
  sleep:{},
};

let S = null;            // state
let tab = 'today';
let viewDate = today();
let saveTimer = null;

function today(){ const d=new Date(); return iso(d); }
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fromIso(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function addDays(s,n){ const d=fromIso(s); d.setDate(d.getDate()+n); return iso(d); }
function weekStart(s){ const d=fromIso(s); const wd=(d.getDay()+6)%7; d.setDate(d.getDate()-wd); return iso(d); } // Monday
const DOW=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmt(s){ const d=fromIso(s); return MON[d.getMonth()]+' '+d.getDate(); }
function fmtDow(s){ const d=fromIso(s); return DOW[(d.getDay()+6)%7]; }

// Storage adapter: Claude artifact storage when available, otherwise this device (localStorage)
const store = {
  async get(k){
    if (window.storage && window.storage.get) { const r = await window.storage.get(k); return r ? r.value : null; }
    return localStorage.getItem(k);
  },
  async set(k,v){
    if (window.storage && window.storage.set) { return window.storage.set(k,v); }
    localStorage.setItem(k,v);
  }
};
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
async function load(){
  try{
    const raw = await store.get(STORE_KEY);
    if(!raw) throw new Error('empty');
    S = JSON.parse(raw);
  }catch(e){
    S = JSON.parse(JSON.stringify(SEED));
    try{ await store.set(STORE_KEY, JSON.stringify(S)); }catch(err){ console.error('First save failed',err); }
  }
  // gentle migrations
  S.settings = S.settings||{sleepTarget:8};
  S.habits = S.habits||[]; S.goals=S.goals||{}; S.habitMarks=S.habitMarks||{}; S.sleep=S.sleep||{};
  render();
}
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{ await store.set(STORE_KEY, JSON.stringify(S)); }
    catch(e){ console.error('Save failed', e); }
  }, 350);
}

/* ================= derived ================= */
function dayGoals(d){ return S.goals[d]||[]; }
function dayPct(d){
  const g=dayGoals(d); if(!g.length) return null;
  const done=g.filter(x=>x.status==='✅').length;
  return done/g.length;
}
function habitMark(d,hid){ return (S.habitMarks[d]||{})[hid]||null; }
function weekDays(d){ const ws=weekStart(d); return Array.from({length:7},(_,i)=>addDays(ws,i)); }
function habitWeekCount(hid,d){ return weekDays(d).filter(x=>habitMark(x,hid)==='✅').length; }
function habitStreak(hid){
  // consecutive ✅ days ending today (or yesterday if today unmarked)
  let d=today(), n=0;
  if(habitMark(d,hid)!=='✅') d=addDays(d,-1);
  while(habitMark(d,hid)==='✅'){ n++; d=addDays(d,-1); }
  return n;
}
function sleepEntry(d){ return S.sleep[d]||null; }

/* ================= render ================= */
const TABS=[
  {id:'today', ic:'🎯', tl:'Today'},
  {id:'habits',ic:'🔁', tl:'Habits'},
  {id:'sleep', ic:'😴', tl:'Sleep'},
  {id:'stats', ic:'🏆', tl:'Stats'},
];
function render(){
  document.getElementById('tabs').innerHTML = TABS.map(t=>
    `<button class="tab ${tab===t.id?'on':''}" onclick="setTab('${t.id}')">
      <span class="ic">${t.ic}</span><span class="tl">${t.tl}</span></button>`).join('');
  const m=document.getElementById('main');
  if(tab==='today') m.innerHTML = viewToday();
  if(tab==='habits') m.innerHTML = viewHabits();
  if(tab==='sleep') m.innerHTML = viewSleep();
  if(tab==='stats') m.innerHTML = viewStats();
}
function setTab(t){ tab=t; render(); window.scrollTo(0,0); }
function setDate(d){ viewDate=d; render(); }

function datebar(){
  const isToday = viewDate===today();
  return `<div class="datebar">
    <button class="nav" onclick="setDate('${addDays(viewDate,-1)}')">‹</button>
    <div class="datelabel">
      <div class="dow">${isToday?'Today':fmtDow(viewDate)}</div>
      <div class="dm">${fmt(viewDate)}</div>
    </div>
    <button class="nav" onclick="setDate('${addDays(viewDate,1)}')">›</button>
    <button class="todaybtn ${isToday?'hidden':''}" onclick="setDate('${today()}')">Today</button>
  </div>`;
}

/* ---------- TODAY ---------- */
function ring(pct){
  const R=44, C=2*Math.PI*R;
  const off = pct==null ? C : C*(1-pct);
  const col = pct==null?'var(--card2)':(pct>=1?'var(--green)':pct>=0.5?'var(--orange)':'var(--pink)');
  return `<div class="ringwrap">
    <svg width="104" height="104" viewBox="0 0 104 104">
      <circle cx="52" cy="52" r="${R}" fill="none" stroke="var(--card2)" stroke-width="9"/>
      <circle cx="52" cy="52" r="${R}" fill="none" stroke="${col}" stroke-width="9"
        stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}" style="transition:stroke-dashoffset .4s"/>
    </svg>
    <div class="ringpct"><div>${pct==null?'–':Math.round(pct*100)+'%'}<small>goals done</small></div></div>
  </div>`;
}
function viewToday(){
  const d=viewDate, g=dayGoals(d);
  const done=g.filter(x=>x.status==='✅').length;
  const dailyHabits = S.habits;
  const hMarked = dailyHabits.filter(h=>habitMark(d,h.id)==='✅').length;
  const sl = sleepEntry(d);
  const rows = g.map(x=>`
    <div class="goalrow">
      <button class="statuschip ${x.status?'s'+x.status:''}" onclick="cycleGoal('${d}','${x.id}')">${x.status||''}</button>
      <div class="goaltext ${x.status==='✅'?'done':''}">${esc(x.text)}</div>
      <button class="goaldel" onclick="delGoal('${d}','${x.id}')">✕</button>
    </div>`).join('');
  return datebar()+`
  <div class="hero">
    ${ring(dayPct(d))}
    <div class="herostats">
      <div class="hstat"><span class="dot" style="background:var(--orange)"></span><b>${done}/${g.length||0}</b>&nbsp;goals done</div>
      <div class="hstat"><span class="dot" style="background:var(--pink)"></span><b>${hMarked}/${dailyHabits.length}</b>&nbsp;habits ✅</div>
      <div class="hstat"><span class="dot" style="background:var(--blue)"></span><b>${sl?sl.hours+'h':'–'}</b>&nbsp;sleep logged</div>
    </div>
  </div>
  <div class="sect">Goals <span class="sub">tap the box to cycle status</span></div>
  <div class="card">
    ${rows || `<div class="empty">No goals yet for this day.<br>Add your first one below 👇</div>`}
    <div class="addrow">
      <input id="newgoal" placeholder="Add a goal…" enterkeyhint="done" onkeydown="if(event.key==='Enter')addGoal('${d}')">
      <button class="addbtn" onclick="addGoal('${d}')">+</button>
    </div>
  </div>
  <div class="legend"><span>✅ Done</span><span>⏳ In progress</span><span>❌ Skipped</span><span>⏸️ On hold</span></div>`;
}
function cycleGoal(d,id){
  const g=(S.goals[d]||[]).find(x=>x.id===id); if(!g) return;
  const i=STATUS_CYCLE.indexOf(g.status);
  g.status=STATUS_CYCLE[(i+1)%STATUS_CYCLE.length];
  save(); render();
}
function addGoal(d){
  const inp=document.getElementById('newgoal');
  const t=inp.value.trim(); if(!t) return;
  (S.goals[d]=S.goals[d]||[]).push({id:uid(),text:t,status:null});
  save(); render();
  const n=document.getElementById('newgoal'); if(n){n.focus();}
}
function delGoal(d,id){
  S.goals[d]=(S.goals[d]||[]).filter(x=>x.id!==id);
  if(!S.goals[d].length) delete S.goals[d];
  save(); render();
}

/* ---------- HABITS ---------- */
let habitFormOpen=false, hfFreq='Daily', hfTarget=7;
function viewHabits(){
  const d=viewDate;
  const rows=S.habits.map(h=>{
    const mk=habitMark(d,h.id);
    const wk=habitWeekCount(h.id,d);
    const streak=habitStreak(h.id);
    const pips=weekDays(d).map(x=>{
      const m=habitMark(x,h.id);
      return `<span class="pip ${m==='✅'?'hit':m==='❌'?'on':''} ${x===d?'today':''}"></span>`;
    }).join('');
    const meta = h.freq==='Weekly'
      ? `${wk}/${h.target} this week ${wk>=h.target?'🎯':''}`
      : `${wk}/7 this week${streak>1?` · <span class="streak">🔥 ${streak}-day streak</span>`:''}`;
    return `<div class="habitrow">
      <button class="statuschip ${mk?'s'+mk:''}" onclick="cycleHabit('${d}','${h.id}')">${mk||''}</button>
      <div class="habitinfo">
        <div class="habitname">${esc(h.name)}</div>
        <div class="habitmeta">${h.freq==='Weekly'?'Weekly':'Daily'} · ${meta}</div>
        <div class="weekpips">${pips}</div>
      </div>
      <button class="habitdel" onclick="delHabit('${h.id}')">✕</button>
    </div>`;
  }).join('');
  const form = habitFormOpen ? `
    <div class="habitform">
      <input type="text" id="hfname" placeholder="Habit name (e.g., Read 10 pages)">
      <div class="freqrow">
        <div class="seg">
          <button class="${hfFreq==='Daily'?'on':''}" onclick="hfSetFreq('Daily')">Daily</button>
          <button class="${hfFreq==='Weekly'?'on':''}" onclick="hfSetFreq('Weekly')">Weekly</button>
        </div>
        <div class="tgt">
          <button onclick="hfTgt(-1)">−</button><b>${hfTarget}×/wk</b><button onclick="hfTgt(1)">+</button>
        </div>
      </div>
      <button class="addbtn" style="width:100%;height:46px;font-size:15px" onclick="addHabit()">Add habit</button>
    </div>` : `
    <div class="addrow"><button class="addbtn" style="width:100%;font-size:15px" onclick="habitFormOpen=true;render()">+ New habit</button></div>`;
  return datebar()+`
  <div class="sect">Habits <span class="sub">tap to mark · pips = this week</span></div>
  <div class="card">${rows || `<div class="empty">No habits yet. Add one below — or restore a backup from the Stats tab.</div>`}${form}</div>
  <div class="legend"><span>✅ Did it</span><span>❌ Missed</span><span>tap again to clear</span></div>`;
}
function hfSetFreq(f){ hfFreq=f; hfTarget=f==='Daily'?7:4; render(); }
function hfTgt(n){ hfTarget=Math.min(7,Math.max(1,hfTarget+n)); render(); }
function cycleHabit(d,hid){
  const m=habitMark(d,hid);
  const nx = m===null?'✅':m==='✅'?'❌':null;
  S.habitMarks[d]=S.habitMarks[d]||{};
  if(nx===null) delete S.habitMarks[d][hid]; else S.habitMarks[d][hid]=nx;
  if(!Object.keys(S.habitMarks[d]).length) delete S.habitMarks[d];
  save(); render();
}
function addHabit(){
  const t=document.getElementById('hfname').value.trim(); if(!t) return;
  S.habits.push({id:uid(),name:t,freq:hfFreq,target:hfTarget});
  habitFormOpen=false; save(); render();
}
function delHabit(id){
  if(!confirm('Remove this habit? Its history stays saved.')) return;
  S.habits=S.habits.filter(h=>h.id!==id); save(); render();
}

/* ---------- SLEEP ---------- */
function viewSleep(){
  const d=viewDate, e=sleepEntry(d), tgt=S.settings.sleepTarget;
  const h=e?e.hours:null;
  const cls = h==null?'empty':h>=tgt?'hit':'under';
  // last 7 days bars ending on viewDate
  const days = Array.from({length:7},(_,i)=>addDays(d,i-6));
  const maxH = Math.max(tgt+1, ...days.map(x=>sleepEntry(x)?.hours||0));
  const bars = days.map(x=>{
    const se=sleepEntry(x);
    const hh=se?se.hours:0;
    const pct=Math.round(hh/maxH*100);
    return `<div class="barcol">
      <div class="barval">${se?se.hours:''}</div>
      <div class="bar ${se?(se.hours>=tgt?'hit':'under'):''}" style="height:${se?Math.max(pct,6):4}%"></div>
      <div class="barlab">${fmtDow(x).slice(0,2)}</div>
    </div>`;
  }).join('');
  const tgtTop = 6 + (1 - tgt/maxH) * (120-26);
  return datebar()+`
  <div class="sect">Last night</div>
  <div class="card sleepcard">
    <div class="sleepbig ${cls}">${h==null?'–':h}<small> hrs</small></div>
    <div class="sleepctl">
      <button onclick="bumpSleep('${d}',-0.5)">−</button>
      <button onclick="bumpSleep('${d}',0.5)">+</button>
    </div>
    <input class="sleepnote" placeholder="Note (e.g., 12–9, woke at 4am…)" value="${e?esc(e.note||''):''}"
      onchange="setSleepNote('${d}',this.value)">
    ${e?`<button class="sleepclear" onclick="clearSleep('${d}')">Clear this night</button>`:''}
  </div>
  <div class="sect">Past 7 nights</div>
  <div class="card" style="position:relative">
    <div class="bars">${bars}</div>
    <div class="tgthash" style="top:${tgtTop+16}px"></div>
    <div class="tgtline">
      <span>Nightly target</span>
      <span class="tgt"><button onclick="bumpTarget(-0.5)">−</button><b>${tgt}h</b><button onclick="bumpTarget(0.5)">+</button></span>
    </div>
  </div>`;
}
function bumpSleep(d,n){
  const e=S.sleep[d]||{hours:0,note:''};
  e.hours=Math.min(24,Math.max(0,Math.round((e.hours+n)*2)/2));
  S.sleep[d]=e; save(); render();
}
function setSleepNote(d,v){
  const e=S.sleep[d]||{hours:0,note:''};
  e.note=v; S.sleep[d]=e; save();
}
function clearSleep(d){ delete S.sleep[d]; save(); render(); }
function bumpTarget(n){ S.settings.sleepTarget=Math.min(12,Math.max(4,Math.round((S.settings.sleepTarget+n)*2)/2)); save(); render(); }

/* ---------- STATS ---------- */
let statsMode = 'week';           // week | month | year
let statsMonth = today().slice(0,7);
let statsYear = Number(today().slice(0,4));
const MIN_YEAR = 2026;

function monthDates(ym){ const [y,m]=ym.split('-').map(Number); const n=new Date(y,m,0).getDate();
  return Array.from({length:n},(_,i)=>ym+'-'+String(i+1).padStart(2,'0')); }
function yearMonths(y){ return Array.from({length:12},(_,i)=>y+'-'+String(i+1).padStart(2,'0')); }
function aggGoals(dates){ let done=0,total=0,days=0,pctSum=0;
  dates.forEach(d=>{ const g=dayGoals(d); if(g.length){ days++; const dn=g.filter(x=>x.status==='✅').length; done+=dn; total+=g.length; pctSum+=dn/g.length; }});
  return {done,total,days,avg:days?pctSum/days:null}; }
function aggSleep(dates){ const v=dates.map(d=>sleepEntry(d)).filter(Boolean).map(e=>e.hours);
  return {n:v.length,avg:v.length?v.reduce((a,b)=>a+b,0)/v.length:null}; }
function aggHabit(hid,dates){ return dates.filter(d=>habitMark(d,hid)==='✅').length; }
function habitDaysMarked(hid,dates){ return dates.filter(d=>habitMark(d,hid)!==null).length; }
function pctClass(p){ return p==null?'':p>=0.8?'p1':p>=0.5?'p2':p>0?'p3':'p4'; }

/* --- svg bar chart: items = [{label,value}] --- */
function barChart(items,{color='var(--orange)',unit='',yMax=null,target=null,tcolor='var(--blue)'}={}){
  const W=480,H=150,padL=26,padB=18,padT=12;
  const cw=(W-padL-8)/items.length;
  const vals=items.map(i=>i.value).filter(v=>v!=null);
  const max=yMax||Math.max(1,...vals,target||0);
  const y=v=>padT+(H-padT-padB)*(1-v/max);
  let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  // gridlines
  for(const gv of [max, max/2]){
    s+=`<line x1="${padL}" y1="${y(gv)}" x2="${W-4}" y2="${y(gv)}" stroke="rgba(255,255,255,.06)"/>`;
    s+=`<text x="${padL-4}" y="${y(gv)+3}" text-anchor="end" class="axval">${Math.round(gv*10)/10}</text>`;
  }
  if(target!=null) s+=`<line x1="${padL}" y1="${y(target)}" x2="${W-4}" y2="${y(target)}" stroke="${tcolor}" stroke-dasharray="4 4" stroke-opacity=".55"/>`;
  items.forEach((it,i)=>{
    const x=padL+i*cw+cw*0.16, bw=cw*0.68;
    if(it.value!=null){
      const h=Math.max(3,(H-padT-padB)*(it.value/max));
      s+=`<rect x="${x}" y="${H-padB-h}" width="${bw}" height="${h}" rx="4" fill="${it.fill||color}"/>`;
    } else {
      s+=`<rect x="${x}" y="${H-padB-3}" width="${bw}" height="3" rx="1.5" fill="rgba(255,255,255,.08)"/>`;
    }
    s+=`<text x="${x+bw/2}" y="${H-5}" text-anchor="middle" class="axlab">${it.label}</text>`;
  });
  return s+'</svg>';
}
/* --- svg line chart for sleep across a month --- */
function lineChart(dates,{target=null}={}){
  const W=480,H=150,padL=26,padB=18,padT=12;
  const pts=dates.map((d,i)=>({i,e:sleepEntry(d)}));
  const vals=pts.filter(p=>p.e).map(p=>p.e.hours);
  const max=Math.max(target?target+1:9,...vals,1);
  const x=i=>padL+(W-padL-10)*(dates.length===1?0.5:i/(dates.length-1));
  const y=v=>padT+(H-padT-padB)*(1-v/max);
  let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  for(const gv of [max, max/2]){
    s+=`<line x1="${padL}" y1="${y(gv)}" x2="${W-4}" y2="${y(gv)}" stroke="rgba(255,255,255,.06)"/>`;
    s+=`<text x="${padL-4}" y="${y(gv)+3}" text-anchor="end" class="axval">${Math.round(gv*10)/10}</text>`;
  }
  if(target!=null) s+=`<line x1="${padL}" y1="${y(target)}" x2="${W-4}" y2="${y(target)}" stroke="var(--blue)" stroke-dasharray="4 4" stroke-opacity=".55"/>`;
  // segments between consecutive logged nights
  let path='', prev=null;
  pts.forEach(p=>{
    if(p.e){ const cmd=(prev&&prev.i===p.i-1)?'L':'M'; path+=`${cmd}${x(p.i)} ${y(p.e.hours)} `; prev=p; }
    else prev=null;
  });
  s+=`<path d="${path}" fill="none" stroke="var(--blue)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
  pts.forEach(p=>{ if(p.e) s+=`<circle cx="${x(p.i)}" cy="${y(p.e.hours)}" r="3" fill="var(--blue)"/>`; });
  dates.forEach((d,i)=>{ const dd=Number(d.slice(8));
    if(dd===1||dd%5===0) s+=`<text x="${x(i)}" y="${H-5}" text-anchor="middle" class="axlab">${dd}</text>`; });
  return s+'</svg>';
}
/* --- tiny 12-bar sparkline for a habit's year --- */
function spark12(counts,max){
  const W=110,H=26,bw=W/12;
  let s=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" class="hb12">`;
  counts.forEach((c,i)=>{
    const h=Math.max(2,(H-2)*(max?c/max:0));
    s+=`<rect x="${i*bw+1}" y="${H-h}" width="${bw-2.5}" height="${h}" rx="1.5" fill="${c?'var(--pink)':'rgba(255,255,255,.09)'}"/>`;
  });
  return s+'</svg>';
}

function kpis(list){
  return `<div class="kpigrid">`+list.map(k=>
    `<div class="kpi"><div class="v" style="color:${k.c}">${k.v}</div><div class="l">${k.l}</div></div>`).join('')+`</div>`;
}

function viewStats(){
  const seg=`<div class="segbar">
    <button class="${statsMode==='week'?'on':''}" onclick="statsMode='week';render()">Week</button>
    <button class="${statsMode==='month'?'on':''}" onclick="statsMode='month';render()">Month</button>
    <button class="${statsMode==='year'?'on':''}" onclick="statsMode='year';render()">Year</button>
  </div>`;
  let body = statsMode==='week'?statsWeek():statsMode==='month'?statsMonthView():statsYearView();
  return seg+body+`
  <div class="sect">Backup</div>
  <div class="card">
    <div class="wkrow" style="justify-content:space-between">
      <div class="n" style="font-weight:400;color:var(--muted);font-size:12.5px">Data lives on this device. Back it up before switching phones or clearing Safari data.</div>
    </div>
    <div class="addrow" style="gap:8px">
      <button class="addbtn" style="flex:1;width:auto;font-size:14px;background:var(--card2);color:var(--ink)" onclick="exportData()">Export backup</button>
      <button class="addbtn" style="flex:1;width:auto;font-size:14px;background:var(--card2);color:var(--ink)" onclick="importData()">Restore</button>
    </div>
  </div>`;
}

/* ----- WEEK ----- */
function statsWeek(){
  const wk=weekDays(today());
  const g=aggGoals(wk), sl=aggSleep(wk);
  const dgrid = wk.map(d=>{
    const p=dayPct(d);
    return `<div class="dg"><div class="cell ${pctClass(p)} ${d===today()?'today':''}">${p==null?'·':Math.round(p*100)}</div><div class="lab">${fmtDow(d).slice(0,2)}</div></div>`;
  }).join('');
  const hrows=S.habits.map(h=>{
    const c=habitWeekCount(h.id,today()); const hit=c>=h.target;
    return `<div class="wkrow"><div class="n">${esc(h.name)}</div>
      <div class="meter"><i class="${hit?'hit':''}" style="width:${Math.min(100,c/h.target*100)}%"></i></div>
      <div class="c">${c}/${h.target}${hit?' 🎯':''}</div></div>`;
  }).join('');
  return kpis([
    {v:g.avg==null?'–':Math.round(g.avg*100)+'%', l:'Avg day score', c:'var(--orange)'},
    {v:g.done, l:'Goals done', c:'var(--green)'},
    {v:g.days, l:'Days tracked', c:'var(--pink)'},
    {v:sl.avg==null?'–':sl.avg.toFixed(1)+'h', l:'Avg sleep', c:'var(--blue)'},
  ])+`
  <div class="sect">Daily goal scores</div>
  <div class="card"><div class="daygrid7">${dgrid}</div></div>
  <div class="sect">Habits this week</div>
  <div class="card">${hrows||'<div class="empty">Add habits to see weekly progress.</div>'}</div>`;
}

/* ----- MONTH ----- */
function shiftMonth(n){ let [y,m]=statsMonth.split('-').map(Number); m+=n; if(m<1){m=12;y--;} if(m>12){m=1;y++;}
  if(y<MIN_YEAR) return; statsMonth=y+'-'+String(m).padStart(2,'0'); render(); }
function statsMonthView(){
  const [y,m]=statsMonth.split('-').map(Number);
  const dates=monthDates(statsMonth);
  const g=aggGoals(dates), sl=aggSleep(dates);
  const nav=`<div class="periodnav">
    <button class="nav" onclick="shiftMonth(-1)">‹</button>
    <div class="plabel">${MON[m-1]} ${y}</div>
    <button class="nav" onclick="shiftMonth(1)">›</button></div>`;
  // calendar heatmap (Mon-start)
  const firstDow=(fromIso(statsMonth+'-01').getDay()+6)%7;
  let cells=''; for(let i=0;i<firstDow;i++) cells+='<div class="calcell blank"></div>';
  dates.forEach(d=>{ const p=dayPct(d);
    cells+=`<div class="calcell ${pctClass(p)} ${d===today()?'today':''}">${Number(d.slice(8))}</div>`; });
  // habits in month
  const hrows=S.habits.map(h=>{
    const c=aggHabit(h.id,dates);
    const poss=h.freq==='Weekly'? Math.ceil(dates.length/7)*h.target : dates.length;
    return `<div class="wkrow"><div class="n">${esc(h.name)}</div>
      <div class="meter"><i class="${c>=poss?'hit':''}" style="width:${Math.min(100,c/poss*100)}%"></i></div>
      <div class="c">${c}×</div></div>`;
  }).join('');
  return nav+kpis([
    {v:g.avg==null?'–':Math.round(g.avg*100)+'%', l:'Avg day score', c:'var(--orange)'},
    {v:g.done+(g.total?'/'+g.total:''), l:'Goals done', c:'var(--green)'},
    {v:g.days, l:'Days tracked', c:'var(--pink)'},
    {v:sl.avg==null?'–':sl.avg.toFixed(1)+'h', l:'Avg sleep', c:'var(--blue)'},
  ])+`
  <div class="sect">Goal score calendar</div>
  <div class="card cal">
    <div class="calhead">${DOW.map(d=>'<span>'+d.slice(0,2)+'</span>').join('')}</div>
    <div class="calgrid">${cells}</div>
  </div>
  <div class="sect">Sleep — ${MON[m-1]} <span class="sub">dashed = target</span></div>
  <div class="card chartwrap">${sl.n?lineChart(dates,{target:S.settings.sleepTarget}):'<div class="empty">No sleep logged this month.</div>'}</div>
  <div class="sect">Habits — ${MON[m-1]}</div>
  <div class="card">${hrows||'<div class="empty">Add habits to see monthly totals.</div>'}</div>`;
}

/* ----- YEAR ----- */
function shiftYear(n){ if(statsYear+n<MIN_YEAR) return; statsYear+=n; render(); }
function statsYearView(){
  const months=yearMonths(statsYear);
  const allDates=months.flatMap(monthDates);
  const g=aggGoals(allDates), sl=aggSleep(allDates);
  const nav=`<div class="periodnav">
    <button class="nav" onclick="shiftYear(-1)">‹</button>
    <div class="plabel">${statsYear}</div>
    <button class="nav" onclick="shiftYear(1)">›</button></div>`;
  const scoreBars=months.map((ym,i)=>{ const a=aggGoals(monthDates(ym));
    return {label:MON[i][0], value:a.avg==null?null:Math.round(a.avg*100)}; });
  const sleepBars=months.map((ym,i)=>{ const a=aggSleep(monthDates(ym));
    return {label:MON[i][0], value:a.avg==null?null:Math.round(a.avg*10)/10, fill:'var(--blue)'}; });
  // habits: 12-month sparklines + totals + weekly-target hit count
  const hrows=S.habits.map(h=>{
    const counts=months.map(ym=>aggHabit(h.id,monthDates(ym)));
    const totalC=counts.reduce((a,b)=>a+b,0);
    let extra='';
    if(h.freq==='Weekly'){
      let hit=0, ws=weekStart(statsYear+'-01-01');
      while(ws.slice(0,4)<=String(statsYear)){
        const wd=Array.from({length:7},(_,i)=>addDays(ws,i));
        if(wd.filter(d=>habitMark(d,h.id)==='✅').length>=h.target) hit++;
        ws=addDays(ws,7);
      }
      extra=` · ${hit} wk 🎯`;
    }
    return `<div class="wkrow"><div class="n">${esc(h.name)}<div style="font-weight:400;font-size:11px;color:var(--faint)">${totalC}×${extra}</div></div>
      ${spark12(counts,Math.max(...counts,1))}</div>`;
  }).join('');
  return nav+kpis([
    {v:g.avg==null?'–':Math.round(g.avg*100)+'%', l:'Avg day score', c:'var(--orange)'},
    {v:g.done, l:'Goals done', c:'var(--green)'},
    {v:g.days, l:'Days tracked', c:'var(--pink)'},
    {v:sl.avg==null?'–':sl.avg.toFixed(1)+'h', l:'Avg sleep', c:'var(--blue)'},
  ])+`
  <div class="sect">Goal score by month <span class="sub">%</span></div>
  <div class="card chartwrap">${g.days?barChart(scoreBars,{yMax:100}):'<div class="empty">Nothing tracked in '+statsYear+' yet.</div>'}</div>
  <div class="sect">Sleep by month <span class="sub">avg hrs · dashed = target</span></div>
  <div class="card chartwrap">${sl.n?barChart(sleepBars,{color:'var(--blue)',target:S.settings.sleepTarget}):'<div class="empty">No sleep logged in '+statsYear+'.</div>'}</div>
  <div class="sect">Habits — ${statsYear} <span class="sub">monthly rhythm</span></div>
  <div class="card">${hrows||'<div class="empty">Add habits to see yearly trends.</div>'}</div>`;
}

function exportData(){
  const blob = new Blob([JSON.stringify(S,null,1)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'goaltracker-backup-' + today() + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
}
function importData(){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'application/json,.json';
  inp.onchange = () => {
    const f = inp.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try{
        const data = JSON.parse(rd.result);
        if(!data.goals && !data.habits) throw new Error('Not a Goal Tracker backup');
        S = data;
        S.settings = S.settings||{sleepTarget:8};
        S.habits=S.habits||[]; S.goals=S.goals||{}; S.habitMarks=S.habitMarks||{}; S.sleep=S.sleep||{};
        save(); render();
        alert('Backup restored ✅');
      }catch(e){ alert('That file could not be read as a Goal Tracker backup.'); }
    };
    rd.readAsText(f);
  };
  inp.click();
}

function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

load();
</script>
